<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Tabel HTML</title>
</head>
<body>

    <h3>Ini adalah tabel</h3>

    <table border="1" cellpadding="8" cellspacing="0">
        <caption><b>Contoh Tabel</b></caption>

        <!-- Baris Header -->
        <tr>
            <th>Kolom 1</th>
            <th>Kolom 2</th>
        </tr>

        <!-- Baris 1 -->
        <tr>
            <td>Baris 1 Kolom 1</td>
            <td>Baris 1 Kolom 2</td>
        </tr>

        <!-- Baris 2 -->
        <tr>
            <td>Baris 2 Kolom 1</td>
            <td>Baris 2 Kolom 2</td>
        </tr>
    </table>

    <br>

    <!-- Contoh tabel dengan format tambahan -->
    <h3>Tabel dengan Format Tambahan</h3>

    <table border="1" cellpadding="10" cellspacing="2" width="50%">
        <tr bgcolor="#cccccc">
            <th>Nama</th>
            <th>Umur</th>
            <th>Kota</th>
        </tr>
        <tr align="center">
            <td>Andi</td>
            <td>20</td>
            <td>Jakarta</td>
        </tr>
        <tr align="center">
            <td>Budi</td>
            <td>22</td>
            <td>Bandung</td>
        </tr>
        <tr align="center">
            <td>Citra</td>
            <td>21</td>
            <td>Surabaya</td>
        </tr>
    </table>

</body>
</html>
